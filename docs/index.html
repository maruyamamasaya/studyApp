<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>Study Notes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="styles.css?v=20261001-folders">
</head>
<body>
  <div id="app">読み込み中...</div>
  <script>
    var theme = localStorage.getItem('study-notes:theme');
    if (/^[1-5]$/.test(theme || '')) document.documentElement.dataset.theme = theme;
    window.READER_TOOLS_CONFIG = { homepageFile: 'README.md', showBackupLink: false };
    window.$docsify = {
      homepage: 'README.md', loadSidebar: true, name: 'Study Notes',
      auto2top: true, maxLevel: 4, subMaxLevel: 0, markdown: { breaks: true }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>
  <script src="content-tools.js?v=20261001-wiki"></script>
  <script src="unique-heading-ids.js"></script>
  <script src="obsidian-wikilinks.js"></script>
  <script src="reader-tools.js?v=20261001-wiki"></script>
  <script src="folder-navigation.js?v=20261001-folders"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
