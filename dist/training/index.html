<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><meta name="description" content="Study App の研修資料"><meta name="theme-color" content="#f7f7f5"><script>
      (() => {
        const themes = ['standard', 'wiki', 'living-aurora', 'blue-cosmos', 'pulse-neon'];
        try {
          const savedTheme = localStorage.getItem('study-app:theme');
          if (themes.includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
        } catch {
          // The standard theme remains usable when storage is unavailable.
        }
      })();
    </script><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>研修資料 | Study App</title><link rel="stylesheet" href="/_astro/BaseLayout.DeTJmq6w.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="/" aria-label="Study App ホーム"><span class="brand-mark" aria-hidden="true">S</span><span>Study App</span></a><div class="header-actions"><label class="theme-picker"><span class="theme-picker__label">テーマ</span><span class="theme-picker__swatch" aria-hidden="true"></span><select aria-label="表示テーマ" data-theme-picker><option value="standard">Standard</option><option value="wiki">Wiki</option><option value="living-aurora">Living Aurora</option><option value="blue-cosmos">Blue Cosmos</option><option value="pulse-neon">Pulse Neon</option></select></label></div></div></header><div class="app-shell"><aside class="sidebar"><details class="sidebar-drawer" open><summary>ページ一覧</summary><div class="sidebar-content"><nav class="primary-nav" aria-label="メインナビゲーション"><a href="/">すべての記事</a><a class="active" href="/training/">研修資料</a></nav><nav class="page-tree" aria-label="記事の階層"><p class="sidebar-heading">ページツリー</p><ul><li class="tree-folder" style="--tree-depth: 0"><span><span aria-hidden="true">⌄</span>学習ノート</span></li><li class="tree-article" style="--tree-depth: 1"><a href="/articles/20260929-121500/">🌟AWS基礎について</a></li><li class="tree-article" style="--tree-depth: 1"><a href="/articles/20260929-121501/">Markdown記法のサンプル集</a></li><li class="tree-article" style="--tree-depth: 1"><a href="/articles/20260929-121502/">数値計算の誤差</a></li><li class="tree-folder" style="--tree-depth: 0"><span><span aria-hidden="true">⌄</span>Wiki</span></li><li class="tree-folder" style="--tree-depth: 1"><span><span aria-hidden="true">⌄</span>anken001</span></li><li class="tree-article" style="--tree-depth: 2"><a href="/articles/20260928-141048/">タイトルを表示したい</a></li><li class="tree-article" style="--tree-depth: 2"><a href="/articles/20260928-141416/">未設定</a></li><li class="tree-article" style="--tree-depth: 2"><a href="/articles/20260928-142231/">未設定</a></li><li class="tree-article" style="--tree-depth: 2"><a href="/articles/20260928-142529/">未設定</a></li><li class="tree-folder" style="--tree-depth: 1"><span><span aria-hidden="true">⌄</span>phase1</span></li><li class="tree-article" style="--tree-depth: 2"><a href="/articles/20260929-121503/">リンク動作確認</a></li><li class="tree-article" style="--tree-depth: 2"><a href="/articles/20260929-121504/">コードと HTML の安全確認</a></li><li class="tree-folder" style="--tree-depth: 1"><span><span aria-hidden="true">⌄</span>training</span></li><li class="tree-article" style="--tree-depth: 2"><a href="/articles/20260929-121458/">README</a></li></ul></nav></div></details></aside><div class="content-column"><main class="content-main"><section class="page-intro compact"><p class="eyebrow">Training</p><h1>研修資料</h1><p>研修向けとして明示された記事だけを表示します。</p></section><section class="article-grid" aria-label="研修記事一覧"></section></main><footer class="site-footer"><span>Study App</span><a href="https://github.com/maruyamamasaya/studyApp" rel="noreferrer">GitHub</a></footer></div></div><script>
      (() => {
        const drawer = document.querySelector('.sidebar-drawer');
        const mobile = window.matchMedia('(max-width: 640px)');
        if (drawer instanceof HTMLDetailsElement) {
          // Keep desktop navigation visible, while leaving the article and its TOC in view on phones.
          const updateDrawer = () => { drawer.open = !mobile.matches; };
          updateDrawer();
          mobile.addEventListener('change', updateDrawer);
        }
        const picker = document.querySelector('[data-theme-picker]');
        if (!(picker instanceof HTMLSelectElement)) return;

        const themeColors = {
          standard: '#f7f7f5',
          wiki: '#f8f5ec',
          'living-aurora': '#05070c',
          'blue-cosmos': '#020611',
          'pulse-neon': '#030607'
        };
        const applyTheme = (theme) => {
          if (!(theme in themeColors)) return;
          document.documentElement.dataset.theme = theme;
          picker.value = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColors[theme]);
        };

        const initialTheme = document.documentElement.dataset.theme || 'standard';
        applyTheme(initialTheme);
        picker.addEventListener('change', () => {
          applyTheme(picker.value);
          try {
            localStorage.setItem('study-app:theme', picker.value);
          } catch {
            // Theme switching still works for this page when storage is unavailable.
          }
        });
      })();
    </script></body></html>
